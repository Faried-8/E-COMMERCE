<div class="card product-card position-relative" style="width: 18rem;">
  <!-- New badge at top left -->
  <span class="position-absolute top-0 start-0 badge bg-success p-2">NEW</span>

  <!-- Wishlist and view buttons at top right -->
  <div class="position-absolute top-0 end-0 p-2">
    <button class="btn btn-outline-secondary rounded-circle me-2">
      <i class="bi bi-heart"></i>
    </button>
    <button class="btn btn-outline-secondary rounded-circle">
      <i class="bi bi-eye"></i>
    </button>
  </div>

  <!-- Product Image dynamically loaded -->
  
  <img [src]="ProductCategory.image" class="card-img-top" alt="Product Image">

  <!-- Card Body -->
  <div class="card-body">
    <!-- Display Product Name -->
    <!-- <h5 class="card-title">{{ ProductCategory?.name }}</h5> -->

    <h5 class="card-title">
      <a [routerLink]="['/product-details', ProductCategory.id]" class="text-decoration-none text-dark">
        {{ ProductCategory?.name }}
      </a>
    </h5>
    
    <!-- Display Product Description or Body -->
    <!-- <p class="card-text">{{ ProductCategory?.body }}</p> -->

    <!-- Price and Rating -->
    <div class="d-flex align-items-center justify-content-between">
      <span class="text-danger fw-bold">{{ ProductCategory.price }}</span>
      
      <!-- Product Rating (static example) -->
      <div class="d-flex align-items-center">
        <span class="text-warning me-1">
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-fill"></i>
          <i class="bi bi-star-half"></i>
        </span>
        <span class="text-muted">(55)</span>
      </div>
    </div>

    <!-- Color Options (static example) -->
    <div class="d-flex mt-2">
      <div class="rounded-circle bg-dark me-2" style="width: 20px; height: 20px;"></div>
      <div class="rounded-circle bg-danger" style="width: 20px; height: 20px;"></div>
    </div>
  </div>
</div>
