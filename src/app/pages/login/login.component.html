<div class="all">
  <app-top-banner></app-top-banner>
  <app-navbar-sign-log></app-navbar-sign-log>

<div class="container px-4 text-center">
      <div class="row gx-5">
        <div class="col">
          <div class="p-3 ImgHover">
            <img src="Untitled-design-35.png" height="600" alt="Mobile-Market">
          </div>
        </div>
        <div class="col">
            <div class="container" style="padding: 13% 1%;">
                <div class="form-container text-center login-box text-white">
                  <h2>Login to Exclusive</h2>
                  <p>Enter your details below</p>
                  <form class="row mt-3 gy-3" [formGroup]="loginForm" (ngSubmit)="handleSubmit()">
                
                    <div class="alert alert-danger col-12" *ngIf="errorMsg">
                      {{errorMsg}}
                     </div>
                     <!-- Email -->
                    <div class="form-group mb-3">
                      <input type="email" class="form-control input-box custom-input form-control pb-0 text-white" placeholder="Email" formControlName="email" required>
                    
                      <div class="alert alert-danger" *ngIf="isSubmitted && userData.email.invalid">
                        <div *ngIf="userData.email.errors?.['required']">Email is required</div>
                        <div *ngIf="userData.email.errors?.['email']">Invalid email</div>
                        <div *ngIf="userData.email.errors?.['minlength']">At least 15 characters required</div>
                      </div>
                    </div>
                    <!-- Password -->
                    <div class="form-group mb-3">
                      <input type="password" class="form-control input-box custom-input form-control pb-0 text-white" placeholder="Password" formControlName="password" required>
                    
                      <div class="alert alert-danger" *ngIf="isSubmitted && userData.password.invalid">
                        <div *ngIf="userData.password.errors?.['required']">Password is required</div>
                      </div>
                    </div>
                    <div class="BTN">
                      <button type="submit" class="btn btn-red w-100" style="height: 3.3rem;">Log in</button>
                   </div>
                    
                  </form>
                </div>
              </div>
              
        </div>
      </div>
</div>
    

<app-footer-section></app-footer-section>
</div>
